[workspace]
resolver = "3"
members = ["crates/core", "crates/shell", "crates/studio"]
default-members = ["crates/studio"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Pdom <peudomi@ciart.com>"]

[workspace.dependencies]
studio-core = { path = "crates/core" }
studio-shell = { path = "crates/shell" }
gpui = { git = "https://github.com/peudomi/gpui.git" }
gpui_platform = { git = "https://github.com/peudomi/gpui.git", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-base = { git = "https://github.com/peudomi/gpui.git" }
euclid = "0.22.14"
